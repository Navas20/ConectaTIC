<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="ConectaTIC - Aplicacion educativa para comunidades indigenas">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ConectaTIC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ConectaTIC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script" crossorigin="anonymous">
  <link rel="preload" href="flutter_bootstrap.js" as="script" crossorigin="anonymous">
  <link rel="preconnect" href="https://conectatic-frontend.vercel.app">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #F7F7F7; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 24px; }
    #splash .logo { width: 88px; height: 88px; background: linear-gradient(135deg, #58CC02, #46A302); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(88,204,2,0.3); }
    #splash h1 { font-size: 28px; font-weight: 700; color: #3C3C3C; margin: 0 0 8px; letter-spacing: -0.3px; }
    #splash p { font-size: 15px; color: #999; margin: 0 0 24px; }
    #splash .bar { width: 160px; height: 4px; background: #E8E8E8; border-radius: 4px; overflow: hidden; }
    #splash .bar-inner { width: 30%; height: 100%; background: linear-gradient(90deg, #58CC02, #7BE04B); border-radius: 4px; animation: load 1.2s ease-in-out infinite; }
    @keyframes load { 0% { width: 10%; margin-left: 0; } 50% { width: 50%; margin-left: 25%; } 100% { width: 10%; margin-left: 90%; } }
    #splash.hidden { opacity: 0; transition: opacity 0.4s ease-out; pointer-events: none; }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var s = document.getElementById('splash');
      if (s) s.classList.add('hidden');
    });
    setTimeout(function() {
      var p = document.querySelector('#splash p');
      if (p && p.textContent === 'Cargando...') {
        p.textContent = 'Esto puede tomar unos segundos en la primera carga';
      }
    }, 5000);
  </script>
</head>
<body>
  <div id="splash">
    <div class="logo">🎓</div>
    <h1>ConectaTIC</h1>
    <p>Cargando...</p>
    <div class="bar"><div class="bar-inner"></div></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
