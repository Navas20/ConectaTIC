<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ConectaTIC - Aplicacion educativa para comunidades indigenas">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ConectaTIC">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ConectaTIC</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; padding: 0; background: #F7F7F7; font-family: system-ui, -apple-system, sans-serif; }
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    #splash .logo { width: 80px; height: 80px; background: #58CC02; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #fff; margin-bottom: 16px; }
    #splash h1 { font-size: 24px; color: #3C3C3C; margin: 0 0 8px; }
    #splash p { font-size: 14px; color: #999; margin: 0; }
    #splash .spinner { margin-top: 24px; width: 32px; height: 32px; border: 3px solid #E8E8E8; border-top-color: #58CC02; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #splash.hidden { opacity: 0; transition: opacity 0.3s ease-out; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">&#x1F393;</div>
    <h1>ConectaTIC</h1>
    <p>Cargando...</p>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('splash').classList.add('hidden');
    });
    setTimeout(function() {
      var el = document.getElementById('splash');
      if (el && !el.classList.contains('hidden')) {
        el.querySelector('p').textContent = 'La app está cargando por primera vez, esto puede tomar unos segundos...';
      }
    }, 5000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
